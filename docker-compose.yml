services:
  mongodb:
    image: mongo
    container_name: nestjs-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: tasks_db
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
